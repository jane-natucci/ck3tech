<body>
  <header>
    <h1>CK3 tech</h1>
    <nav aria-label="Sections">
      <a href="#perks" data-view="perks">Perk trees</a>
      <a href="#innovations" data-view="innovations">Innovations</a>
      <a href="#cultures" data-view="cultures">Cultures</a>
      <a href="#legacies" data-view="legacies">Legacies</a>
    </nav>
    <div class="search"><input id="gsearch" type="search" placeholder="Search everything…  ( / )" autocomplete="off" aria-label="Search perks, innovations, cultures, traditions and legacies" aria-controls="results"><div id="results" role="listbox" hidden></div></div>
    <span class="ver" id="ver"></span>
  </header>
  <main id="app"><p class="lede">Loading…</p></main>
  <!--seo:about-->
  <footer><a id="buildLink" href="https://github.com/jane-natucci/ck3tech/commit/__BUILD_SHA__" target="_blank" rel="noopener" title="View the deployed source commit on GitHub" style="float:right;color:inherit">build __BUILD_LABEL__</a>Unofficial fan page. Data and icons come from the Crusader Kings III game files<span id="gv"></span>; Crusader Kings III is © Paradox Interactive.</footer>

  <script>
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const $ = id => document.getElementById(id);
    const app = $("app");
    let P = null, C = null, L = null; // perks data, culture data, legacies data
    // Every file under ck3/ is requested with ?v=<digest of the data>, which CloudFront caches for a year; a new extraction changes the digest. (Left as the literal token when served locally.)
    const V = "__DATA_VERSION__";
    const load = url => fetch(url + "?v=" + V).then(r => { if (!r.ok) throw new Error(url + ": HTTP " + r.status); return r.json(); });

    // ---------------------------------------------------------------- routing
    // #perks[/<lifestyle>[/<perk>]]  #innovations[/<key>]  #cultures[/<bookmark>[/<culture>[,<culture>...]]]  #legacies[/<track>[/<perk>]]
    const VIEWS = ["perks", "innovations", "cultures", "legacies"];
    // A page's own address (/culture/akan) opens on it: the page says which part of the app it is.
    const startHash = () => location.hash.slice(1) || document.querySelector('meta[name="initial-hash"]')?.content || "";
    const route = () => { const [view = "perks", ...rest] = decodeURIComponent(startHash()).split("/"); return { view: VIEWS.includes(view) ? view : "perks", rest }; };
    const go = (hash) => { history.replaceState(null, "", "#" + hash); render(); };

    async function render() {
      const { view, rest } = route();
      document.querySelectorAll("header nav a").forEach(a => a.toggleAttribute("aria-current", a.dataset.view === view) || a.removeAttribute("aria-current"));
      document.querySelectorAll("header nav a").forEach(a => { if (a.dataset.view === view) a.setAttribute("aria-current", "page"); });
      try {
        if (view === "perks") { P ||= await load("ck3/data.json"); setGv(P); perksView(rest); }
        else if (view === "legacies") { P ||= await load("ck3/data.json"); L ||= await load("ck3/legacies.json"); setGv(P); legaciesView(rest); }
        else { C ||= await load("ck3/culture.json"); P ||= await load("ck3/data.json"); setGv(P); view === "innovations" ? innovationsView(rest) : culturesView(rest); }
      } catch (e) { app.innerHTML = `<p>Couldn't load the data (${esc(e.message)}). Run <code>ruby extract.rb</code> first.</p>`; }
    }
    function setGv(d) { $("gv").textContent = d.game_version ? " (version " + d.game_version + ")" : ""; }
    window.addEventListener("hashchange", render);

    // ---------------------------------------------------------------- perk trees
    const NODE = 24, DX = 100, DY = 96, PADX = 64, PADY = 34;
    let byKey = {}, treeOf = {};
    function perksView([lsKey, perkKey]) {
      if (!Object.keys(byKey).length) for (const l of P.lifestyles) for (const t of l.trees) for (const p of t.perks) { byKey[p.key] = p; treeOf[p.key] = { lifestyle: l, tree: t }; }
      $("ver").textContent = P.lifestyles.reduce((n, l) => n + l.trees.reduce((m, t) => m + t.perks.length, 0), 0) + " perks · 18 trees · 6 lifestyles";
      const sel = byKey[perkKey] ? perkKey : null;
      const ls = (sel && treeOf[sel].lifestyle) || P.lifestyles.find(l => l.key === lsKey) || P.lifestyles[0];
      app.innerHTML = `<p class="lede">Every lifestyle perk in Crusader Kings III, laid out the way the game draws each tree. Pick a lifestyle, then a perk to see what it requires and what it gives.</p>
        <div class="chips" role="group" aria-label="Lifestyle">${P.lifestyles.map(l => `<button data-go="perks/${l.key}" aria-pressed="${l.key === ls.key}">${l.icon ? `<img src="ck3/lifestyles/${l.icon}.png?v=${V}" alt="">` : ""}${esc(l.name)}</button>`).join("")}</div>
        <div class="trees">${ls.trees.map(t => treeSvg(t, sel)).join("")}</div>
        <div id="detail" aria-live="polite">${perkDetail(sel)}</div>`;
    }
    function treeSvg(tree, sel) {
      const xs = tree.perks.map(p => p.x), ys = tree.perks.map(p => p.y);
      const minx = Math.min(...xs), maxx = Math.max(...xs), maxy = Math.max(...ys), miny = Math.min(...ys);
      const px = p => PADX + (p.x - minx) * DX, py = p => PADY + (p.y - miny) * DY;
      const W = PADX * 2 + (maxx - minx) * DX, H = PADY * 2 + (maxy - miny) * DY + 22;
      const chain = new Set(); const walk = k => { if (!k || chain.has(k)) return; chain.add(k); (byKey[k]?.parents || []).forEach(walk); }; walk(sel);
      const edges = tree.perks.flatMap(p => p.parents.map(pk => {
        const a = byKey[pk]; if (!a || treeOf[pk].tree !== tree) return "";
        const x1 = px(a), y1 = py(a), x2 = px(p), y2 = py(p), my = (y1 + y2) / 2;
        return `<path class="edge${chain.has(p.key) && chain.has(pk) ? " on" : ""}" d="M${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}"/>`;
      })).join("");
      const nodes = tree.perks.map(p => `<g class="node${p.key === sel ? " sel" : ""}" data-go="perks/${treeOf[p.key].lifestyle.key}/${p.key}" tabindex="0" role="button" aria-label="${esc(p.name)}" transform="translate(${px(p)} ${py(p)})">
          <circle class="ring" r="${NODE}"/><image href="ck3/icons/${p.icon}.png?v=${V}" x="${-NODE + 5}" y="${-NODE + 5}" width="${(NODE - 5) * 2}" height="${(NODE - 5) * 2}"/><text y="${NODE + 14}">${label(p.name)}</text></g>`).join("");
      return `<section class="tree"${tree.backdrop ? ` style="--bd: url('ck3/trees/${tree.backdrop}.jpg?v=${V}')"` : ""}><h2>${esc(tree.name)}</h2><svg class="graph" viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(tree.name)} tree">${edges}${nodes}</svg></section>`;
    }
    function label(name) {
      const words = name.split(" "); let first = "", i = 0;
      while (i < words.length && (first + " " + words[i]).trim().length <= 13) { first = (first + " " + words[i]).trim(); i++; }
      if (!first) { first = words[0]; i = 1; }
      const rest = words.slice(i).join(" ");
      return rest ? `<tspan x="0">${esc(first)}</tspan><tspan x="0" dy="1.15em">${esc(rest)}</tspan>` : esc(first);
    }
    function fmt(m) {
      const v = m.kind === "percent" ? Math.round(m.value * 1000) / 10 : m.value;
      return `${m.icon ? `<img src="ck3/icons/${m.icon}.png?v=${V}" alt="">` : ""}<span class="${(v >= 0) !== !!m.bad ? "plus" : "minus"}">${v > 0 ? "+" : ""}${v}${m.kind === "percent" ? "%" : ""}</span> ${esc(m.label)}${m.scope ? ` <span class="note">(${esc(m.scope)})</span>` : ""}`;
    }
    function perkDetail(key) {
      const p = byKey[key];
      if (!p) return '<p class="note">Select a perk to see what it requires and what it gives.</p>';
      const { lifestyle, tree } = treeOf[p.key];
      const link = k => `<a data-go="perks/${treeOf[k].lifestyle.key}/${k}">${esc(byKey[k].name)}</a>`;
      const children = Object.values(byKey).filter(c => c.parents.includes(p.key));
      return `<h3>${esc(p.name)}</h3><p class="where">${esc(lifestyle.name)} · ${esc(tree.name)}</p>
        ${p.description ? `<p><em>${esc(p.description)}</em></p>` : ""}
        ${p.trait_name ? `<p><img src="ck3/icons/${p.icon}.png?v=${V}" alt="" width="28" height="28" style="vertical-align:-8px;margin-right:6px">Grants the <strong>${esc(p.trait_name)}</strong> trait.</p>` : ""}
        ${p.modifiers.length ? `<ul>${p.modifiers.map(m => `<li class="mod">${fmt(m)}</li>`).join("")}</ul>` : ""}
        ${p.effects.length ? `<ul>${p.effects.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
        ${!p.modifiers.length && !p.effects.length && !p.description ? `<p class="note">The game's English text for this perk is built in code, so its effects aren't listed here.</p>` : ""}
        ${p.parents.length ? `<p>Requires: ${p.parents.map(link).join(" and ")}</p>` : `<p class="note">A starting perk of the tree: nothing required.</p>`}
        ${children.length ? `<p>Leads to: ${children.map(c => link(c.key)).join(", ")}</p>` : `<p class="note">The end of this branch.</p>`}`;
    }

    // ---------------------------------------------------------------- innovations
    let innBy = null, innFilter = { group: "all", skill: "all" };
    const eraName = k => C.eras.find(e => e.key === k)?.name || k;
    const skillName = s => s ? s[0].toUpperCase() + s.slice(1) : "";
    function innKnownBy(key) { // how many cultures know it at each start
      const out = {};
      for (const b of Object.keys(C.bookmarks)) out[b] = C.cultures.filter(c => c.exists.includes(b) && c.at[b].innovations.includes(key)).length;
      return out;
    }
    function innovationsView([key]) {
      innBy ||= Object.fromEntries(C.innovations.map(i => [i.key, i]));
      $("ver").textContent = C.innovations.length + " innovations · " + C.eras.length + " eras";
      const sel = innBy[key] ? key : null;
      const skills = [...new Set(C.innovations.map(i => i.skill))].filter(Boolean).sort();
      const groups = [...new Set(C.innovations.map(i => i.group_name))].filter(Boolean).sort();
      const shown = C.innovations.filter(i => (innFilter.group === "all" || i.group_name === innFilter.group) && (innFilter.skill === "all" || i.skill === innFilter.skill));
      app.innerHTML = `<p class="lede">Every cultural innovation in Crusader Kings III, by era. A culture discovers innovations over time and moves to the next era once enough of the current one are known. Dashed tiles are regional: only some cultures can discover them.</p>
        <div class="filters"><label>Type</label><div class="chips" style="margin:0">${["all", ...groups].map(g => `<button data-fg="${esc(g)}" aria-pressed="${innFilter.group === g}">${g === "all" ? "All" : esc(g)}</button>`).join("")}</div>
          <label>Skill</label><div class="chips" style="margin:0">${["all", ...skills].map(s => `<button data-fs="${esc(s)}" aria-pressed="${innFilter.skill === s}">${s === "all" ? "All" : esc(skillName(s))}</button>`).join("")}</div></div>
        <div class="erastrip">${C.eras.map(e => `<section class="era"><h2>${esc(e.name)} <span class="note">· from ${e.year}</span></h2><div class="tiles">${shown.filter(i => i.era === e.key).map(i => `<button class="tile${i.regional ? " regional" : ""}${i.key === sel ? " sel" : ""}" data-go="innovations/${i.key}" title="${esc(i.name)}">${i.icon ? `<img src="ck3/innovations/${i.icon}.png?v=${V}" alt="">` : ""}${esc(i.name)}</button>`).join("") || '<span class="note">None with these filters.</span>'}</div></section>`).join("")}</div>
        <div id="detail" aria-live="polite">${innDetail(sel)}</div>`;
    }
    function innDetail(key) {
      const i = innBy[key];
      if (!i) return '<p class="note">Select an innovation to see what it unlocks and which cultures start with it.</p>';
      const known = innKnownBy(key);
      const b = Object.entries(C.bookmarks).map(([date, y]) => `${known[date]} at ${y}`).join(" · ");
      return `<h3>${i.icon ? `<img src="ck3/innovations/${i.icon}.png?v=${V}" alt="" width="40" height="40" style="vertical-align:-12px;margin-right:8px">` : ""}${esc(i.name)}</h3>
        <p class="where">${esc(eraName(i.era))} · ${esc(i.group_name)} · ${esc(skillName(i.skill))}${i.regional ? " · regional" : ""}</p>
        ${i.description ? `<p><em>${esc(i.description)}</em></p>` : ""}
        ${i.unlocks.length ? `<h4>Unlocks</h4><ul>${i.unlocks.map(u => `<li>${esc(u.name)} <span class="note">(${esc(u.kind)})</span></li>`).join("")}</ul>` : ""}
        ${i.modifiers.length ? `<h4>Bonuses</h4><ul>${i.modifiers.map(m => `<li class="mod">${fmt(m)}</li>`).join("")}</ul>` : ""}
        ${i.effects.length ? `<ul>${i.effects.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
        <h4>Known at the start by</h4><p>${esc(b)} of ${C.cultures.filter(c => c.exists.includes("867.1.1")).length} / ${C.cultures.filter(c => c.exists.includes("1066.9.15")).length} / ${C.cultures.filter(c => c.exists.includes("1178.10.1")).length} cultures</p>`;
    }

    // ---------------------------------------------------------------- cultures
    let cultBy = null, sortKey = "heritage", sortDir = 1, q = "", herFilter = "all";
    const pil = k => C.pillars[k]?.name || k;
    const trad = k => C.traditions[k];
    const tradNames = c => [...c.traditions.map(k => ({ k, dlc: false })), ...c.dlc_traditions.map(t => ({ k: t.key, dlc: t.dlc, fb: t.fallback }))];
    function culturesView([bm = "867.1.1", sel]) {
      innBy ||= Object.fromEntries(C.innovations.map(i => [i.key, i]));
      cultBy ||= Object.fromEntries(C.cultures.map(c => [c.key, c]));
      if (!C.bookmarks[bm]) bm = "867.1.1";
      const picked = (sel || "").split(",").filter(k => cultBy[k]);
      $("ver").textContent = C.cultures.length + " cultures · " + Object.keys(C.traditions).length + " traditions";
      const heritages = [...new Set(C.cultures.map(c => c.heritage))].sort((a, b) => pil(a).localeCompare(pil(b)));
      app.innerHTML = `<p class="lede">What each culture is made of and what it knows when the game starts. Pick a start date, then a culture; add up to three with "compare" to see their differences side by side. Dashed traditions need a DLC (a player without it gets a plainer tradition instead).</p>
        <div class="filters"><div class="chips" style="margin:0" role="group" aria-label="Start date">${Object.entries(C.bookmarks).map(([d, y]) => `<button data-go="cultures/${d}${sel ? "/" + sel : ""}" aria-pressed="${d === bm}">${y}</button>`).join("")}</div>
          <select id="her" aria-label="Heritage"><option value="all">All heritages</option>${heritages.map(h => `<option value="${h}"${h === herFilter ? " selected" : ""}>${esc(pil(h))}</option>`).join("")}</select>
          <input id="q" type="search" placeholder="Search a culture or tradition…" value="${esc(q)}"></div>
        <div id="table"></div>
        <div id="detail" aria-live="polite"></div>`;
      $("her").onchange = e => { herFilter = e.target.value; cultTable(bm, picked); };
      $("q").oninput = e => { q = e.target.value; cultTable(bm, picked); };
      cultTable(bm, picked);
      $("detail").innerHTML = picked.length > 1 ? compare(bm, picked) : picked.length === 1 ? cultDetail(bm, cultBy[picked[0]]) : '<p class="note">Select a culture.</p>';
    }
    function cultTable(bm, picked) {
      const ql = q.trim().toLowerCase();
      let rows = C.cultures.filter(c => c.exists.includes(bm) && (herFilter === "all" || c.heritage === herFilter) &&
        (!ql || c.name.toLowerCase().includes(ql) || tradNames(c).some(t => trad(t.k)?.name.toLowerCase().includes(ql))));
      const val = { name: c => c.name, heritage: c => pil(c.heritage), ethos: c => pil(c.ethos), era: c => C.eras.findIndex(e => e.key === c.at[bm].era), inn: c => c.at[bm].innovations.length }[sortKey] || (c => c.name);
      rows.sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : a.name.localeCompare(b.name)) * sortDir; });
      const th = (k, t) => `<th data-sort="${k}">${t}${sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`;
      $("table").innerHTML = `<div class="tablewrap" style="max-height:60vh;overflow-y:auto"><table class="cultures"><thead><tr><th></th>${th("name", "Culture")}${th("heritage", "Heritage")}${th("ethos", "Ethos")}<th>Traditions</th>${th("era", "Era")}${th("inn", "Innovations")}</tr></thead><tbody>
        ${rows.map(c => `<tr class="${picked.includes(c.key) ? "sel" : ""}" data-go="cultures/${bm}/${c.key}"><td><button class="add" data-cmp="${c.key}" aria-pressed="${picked.includes(c.key)}" title="Compare">${picked.includes(c.key) ? "−" : "+"}</button></td><td>${esc(c.name)}</td><td>${esc(pil(c.heritage))}</td><td>${esc(pil(c.ethos))}</td>
          <td>${tradNames(c).map(t => `<span class="pill${t.dlc ? " dlc" : ""}">${esc(trad(t.k)?.name || t.k)}</span>`).join("")}</td><td>${esc(eraName(c.at[bm].era))}</td><td>${c.at[bm].innovations.length}</td></tr>`).join("") || '<tr><td colspan="7" class="note">No culture matches.</td></tr>'}
        </tbody></table></div><p class="note">${rows.length} cultures</p>`;
      $("table").querySelectorAll("th[data-sort]").forEach(t => t.onclick = () => { sortDir = sortKey === t.dataset.sort ? -sortDir : 1; sortKey = t.dataset.sort; cultTable(bm, picked); });
    }
    function innTiles(keys) {
      return C.eras.map(e => { const list = keys.map(k => innBy[k]).filter(i => i && i.era === e.key); return list.length ? `<h4>${esc(e.name)} (${list.length})</h4><div class="minitiles">${list.map(i => `<span data-go="innovations/${i.key}" title="${esc(i.name)}">${i.icon ? `<img src="ck3/innovations/${i.icon}.png?v=${V}" alt="">` : ""}${esc(i.name)}</span>`).join("")}</div>` : ""; }).join("");
    }
    function cultDetail(bm, c) {
      const at = c.at[bm];
      return `<h3>${esc(c.name)}</h3><p class="where">${esc(pil(c.heritage))} heritage · ${esc(pil(c.language))} · ${esc(pil(c.ethos))} · ${esc(pil(c.martial_custom))}${c.parents.length ? " · from " + c.parents.map(p => cultBy[p] ? `<a data-go="cultures/${bm}/${p}">${esc(cultBy[p].name)}</a>` : esc(p)).join(", ") : ""}${c.created ? " · created " + esc(c.created.split(".")[0]) : ""}</p>
        ${C.pillars[c.ethos]?.description ? `<p><em>${esc(C.pillars[c.ethos].description)}</em></p>` : ""}
        <h4>Traditions</h4><ul>${tradNames(c).map(t => `<li><strong>${esc(trad(t.k)?.name || t.k)}</strong>${t.dlc ? ` <span class="note">(needs a DLC${t.fb ? "; otherwise " + esc(trad(t.fb)?.name || t.fb) : ""})</span>` : ""}${trad(t.k)?.description ? `<br><span class="note">${esc(trad(t.k).description)}</span>` : ""}</li>`).join("")}</ul>
        <h4>Known innovations at ${esc(C.bookmarks[bm])} · ${esc(eraName(at.era))} era</h4>${innTiles(at.innovations) || '<p class="note">None yet.</p>'}`;
    }
    function compare(bm, keys) {
      const cs = keys.map(k => cultBy[k]);
      const head = `<tr><th></th>${cs.map(c => `<th>${esc(c.name)}</th>`).join("")}</tr>`;
      const rowOf = (name, f) => `<tr><th>${name}</th>${cs.map(c => `<td>${esc(f(c))}</td>`).join("")}</tr>`;
      const mark = (set) => `<td class="${set ? "yes" : "no"}">${set ? "✓" : "–"}</td>`;
      const allT = [...new Set(cs.flatMap(c => tradNames(c).map(t => t.k)))].sort((a, b) => (trad(a)?.name || a).localeCompare(trad(b)?.name || b));
      const allI = [...new Set(cs.flatMap(c => c.at[bm].innovations))].filter(k => innBy[k]);
      const differing = allI.filter(k => cs.some(c => !c.at[bm].innovations.includes(k)));
      return `<h3>Compare</h3><p class="where">${cs.map(c => esc(c.name)).join(" · ")} at ${esc(C.bookmarks[bm])}. <a data-go="cultures/${bm}/${keys[0]}">Back to ${esc(cs[0].name)} alone</a></p>
        <div class="tablewrap"><table class="compare">${head}
          ${rowOf("Heritage", c => pil(c.heritage))}${rowOf("Language", c => pil(c.language))}${rowOf("Ethos", c => pil(c.ethos))}${rowOf("Martial custom", c => pil(c.martial_custom))}${rowOf("Era", c => eraName(c.at[bm].era))}${rowOf("Innovations known", c => c.at[bm].innovations.length)}
          <tr class="section"><th colspan="${cs.length + 1}">Traditions</th></tr>
          ${allT.map(k => `<tr><th>${esc(trad(k)?.name || k)}</th>${cs.map(c => mark(tradNames(c).some(t => t.k === k))).join("")}</tr>`).join("")}
          <tr class="section"><th colspan="${cs.length + 1}">Innovations they don't all share (${differing.length})</th></tr>
          ${differing.sort((a, b) => C.eras.findIndex(e => e.key === innBy[a].era) - C.eras.findIndex(e => e.key === innBy[b].era) || innBy[a].name.localeCompare(innBy[b].name)).map(k => `<tr><th>${innBy[k].icon ? `<img src="ck3/innovations/${innBy[k].icon}.png?v=${V}" alt="" width="20" height="20" style="vertical-align:-5px;margin-right:4px">` : ""}${esc(innBy[k].name)} <span class="note">${esc(eraName(innBy[k].era))}</span></th>${cs.map(c => mark(c.at[bm].innovations.includes(k))).join("")}</tr>`).join("")}
        </table></div>`;
    }

    // ---------------------------------------------------------------- legacies
    let legFilter = "all", legBy = {}, legPerk = {};
    function legaciesView([trackKey, perkKey]) {
      if (!Object.keys(legBy).length) for (const t of L.tracks) { legBy[t.key] = t; for (const p of t.perks) legPerk[p.key] = { track: t, perk: p, step: t.perks.indexOf(p) + 1 }; }
      const sel = legPerk[perkKey] ? perkKey : null;
      const selTrack = (sel && legPerk[sel].track.key) || (legBy[trackKey] ? trackKey : null);
      $("ver").textContent = L.tracks.length + " tracks · " + L.tracks.reduce((n, t) => n + t.perks.length, 0) + " legacy perks";
      const dlcs = [...new Set(L.tracks.map(t => t.dlc).filter(Boolean))].sort();
      const shown = L.tracks.filter(t => legFilter === "all" || (legFilter === "base" ? !t.dlc : t.dlc === legFilter));
      app.innerHTML = `<p class="lede">A dynasty unlocks legacy perks by spending renown on a track. Each track has five perks, taken in order. Tracks from a DLC are only shown to a dynasty head who owns it.</p>
        <div class="filters"><div class="chips" style="margin:0" role="group" aria-label="Source">${["all", "base", ...dlcs].map(f => `<button data-fl="${esc(f)}" aria-pressed="${legFilter === f}">${f === "all" ? "All" : f === "base" ? "Base game" : esc(f)}</button>`).join("")}</div></div>
        <div class="legacies">${shown.map(t => `<section class="track${t.key === selTrack ? " sel" : ""}"><header data-go="legacies/${t.key}">${t.icon ? `<img src="ck3/${t.icon}?v=${V}" alt="">` : ""}<div><h2>${esc(t.name)}</h2>${t.dlc ? `<span class="pill dlc">${esc(t.dlc)}</span>` : ""}</div></header>
          ${t.description ? `<p class="desc">${esc(t.description)}</p>` : ""}<ol>${t.perks.map(p => `<li class="${p.key === sel ? "sel" : ""}" data-go="legacies/${t.key}/${p.key}" tabindex="0" role="button">${esc(p.name)}</li>`).join("")}</ol></section>`).join("") || '<p class="note">None.</p>'}</div>
        <div id="detail" aria-live="polite">${legDetail(sel, selTrack)}</div>`;
    }
    function legDetail(perkKey, trackKey) {
      if (legPerk[perkKey]) {
        const { track: t, perk: p, step } = legPerk[perkKey];
        const prev = t.perks[step - 2], next = t.perks[step];
        return `<h3>${esc(p.name)}</h3><p class="where">${esc(t.name)} legacy · perk ${step} of ${t.perks.length}${t.dlc ? " · " + esc(t.dlc) : ""}</p>
          ${p.modifiers.length ? `<ul>${p.modifiers.map(m => `<li class="mod">${fmt(m)}</li>`).join("")}</ul>` : ""}
          ${p.effects.length ? `<ul>${p.effects.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
          ${!p.modifiers.length && !p.effects.length ? `<p class="note">The game's English text for this perk is built in code, so its effects aren't listed here.</p>` : ""}
          ${prev ? `<p>Requires: <a data-go="legacies/${t.key}/${prev.key}">${esc(prev.name)}</a></p>` : `<p class="note">The first perk of the track.</p>`}
          ${next ? `<p>Leads to: <a data-go="legacies/${t.key}/${next.key}">${esc(next.name)}</a></p>` : `<p class="note">The last perk of the track.</p>`}`;
      }
      const t = legBy[trackKey];
      if (!t) return '<p class="note">Select a perk to see what it gives.</p>';
      return `<h3>${t.icon ? `<img class="glyph" src="ck3/${t.icon}?v=${V}" alt="" width="40" height="40" style="vertical-align:-12px;margin-right:8px;box-sizing:border-box">` : ""}${esc(t.name)}</h3><p class="where">${t.dlc ? esc(t.dlc) : "Base game"} · ${t.perks.length} perks</p>${t.description ? `<p><em>${esc(t.description)}</em></p>` : ""}
        <ol>${t.perks.map(p => `<li><a data-go="legacies/${t.key}/${p.key}">${esc(p.name)}</a>${p.modifiers.length ? ` <span class="note">${p.modifiers.map(m => esc(m.label)).join(", ")}</span>` : ""}</li>`).join("")}</ol>`;
    }

    // ---------------------------------------------------------------- search
    // One index over everything, built from all three data files the first time the box is used.
    let SX = null, hits = [], cur = -1;
    const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    async function buildIndex() {
      if (SX) return SX;
      [P, C, L] = await Promise.all([P || load("ck3/data.json"), C || load("ck3/culture.json"), L || load("ck3/legacies.json")]);
      const ms = o => (o.modifiers || []).map(m => m.label).concat(o.effects || [], o.description || "").join(" ");
      const out = [];
      for (const l of P.lifestyles) for (const t of l.trees) for (const p of t.perks) out.push({ type: "Perk", name: p.name, sub: l.name + " · " + t.name, text: ms(p), icon: `ck3/icons/${p.icon}.png`, go: `perks/${l.key}/${p.key}` });
      for (const i of C.innovations) out.push({ type: "Innovation", name: i.name, sub: eraName(i.era) + " · " + (i.group_name || ""), text: ms(i) + " " + (i.unlocks || []).map(u => u.name).join(" "), icon: i.icon && `ck3/innovations/${i.icon}.png`, go: `innovations/${i.key}` });
      for (const c of C.cultures) { const bm = Object.keys(C.bookmarks).find(b => c.exists.includes(b)) || "867.1.1"; out.push({ type: "Culture", name: c.name, sub: (C.pillars[c.heritage]?.name || "") + " heritage", text: "", go: `cultures/${bm}/${c.key}` }); }
      for (const [k, t] of Object.entries(C.traditions)) out.push({ type: "Tradition", name: t.name, sub: "culture tradition", text: t.description || "", go: "cultures/867.1.1", q: t.name });
      for (const t of L.tracks) {
        out.push({ type: "Legacy", name: t.name, sub: (t.dlc || "Base game") + " · track", text: t.description || "", icon: t.icon && "ck3/" + t.icon, go: `legacies/${t.key}` });
        for (const p of t.perks) out.push({ type: "Legacy", name: p.name, sub: t.name + " legacy", text: ms(p), icon: t.icon && "ck3/" + t.icon, go: `legacies/${t.key}/${p.key}` });
      }
      out.forEach(o => { o.n = norm(o.name); o.t = norm(o.text); });
      return (SX = out);
    }
    function search(query) {
      const words = norm(query).split(/\s+/).filter(Boolean);
      if (!words.length) return [];
      const scored = [];
      for (const o of SX) {
        if (!words.every(w => o.n.includes(w) || o.t.includes(w))) continue;
        const inName = words.every(w => o.n.includes(w));
        scored.push({ o, score: (o.n === words.join(" ") ? 0 : o.n.startsWith(words[0]) ? 1 : inName ? 2 : 3) });
      }
      return scored.sort((a, b) => a.score - b.score || a.o.name.localeCompare(b.o.name)).map(s => s.o);
    }
    const TYPES = ["Perk", "Innovation", "Culture", "Tradition", "Legacy"];
    function showResults(list, query) {
      const box = $("results");
      if (!query.trim()) { box.hidden = true; hits = []; return; }
      const shown = [];
      for (const type of TYPES) shown.push(...list.filter(o => o.type === type).slice(0, 6));
      hits = shown; cur = hits.length ? 0 : -1;
      let html = "", last = "";
      hits.forEach((o, i) => {
        if (o.type !== last) { const n = list.filter(x => x.type === o.type).length; html += `<h5>${o.type === "Legacy" ? "Legacies" : o.type + "s"} (${n})</h5>`; last = o.type; }
        html += `<div class="hit${i === cur ? " cur" : ""}" role="option" data-hit="${i}">${o.icon ? `<img${o.type === "Legacy" ? ' class="glyph"' : ""} src="${o.icon}?v=${V}" alt="">` : ""}<span>${esc(o.name)}</span><span class="sub">${esc(o.sub)}</span></div>`;
      });
      box.innerHTML = html || '<div class="none">Nothing matches.</div>';
      box.hidden = false;
    }
    function openHit(o) {
      if (!o) return;
      if (o.q) q = o.q; else if (o.type === "Culture") q = "";
      $("results").hidden = true; $("gsearch").blur();
      go(o.go);
    }
    const sbox = $("gsearch");
    sbox.addEventListener("focus", () => { buildIndex().catch(() => {}); });
    sbox.addEventListener("input", async () => { try { await buildIndex(); showResults(search(sbox.value), sbox.value); } catch (e) { $("results").innerHTML = `<div class="none">Couldn't load the data.</div>`; $("results").hidden = false; } });
    sbox.addEventListener("keydown", e => {
      const items = [...$("results").querySelectorAll(".hit")];
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!items.length) return; cur = (cur + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items.forEach((el, i) => el.classList.toggle("cur", i === cur)); items[cur].scrollIntoView({ block: "nearest" }); }
      else if (e.key === "Enter") { e.preventDefault(); openHit(hits[cur]); }
      else if (e.key === "Escape") { sbox.value = ""; $("results").hidden = true; sbox.blur(); }
    });
    document.addEventListener("keydown", e => {
      if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey && !/^(input|textarea|select)$/i.test(e.target.tagName)) { e.preventDefault(); sbox.focus(); sbox.select(); }
    });
    document.addEventListener("click", e => {
      const hit = e.target.closest("[data-hit]");
      if (hit) { openHit(hits[+hit.dataset.hit]); return; }
      if (!e.target.closest(".search")) $("results").hidden = true;
    });

    // ---------------------------------------------------------------- events
    document.addEventListener("click", e => {
      const add = e.target.closest("[data-cmp]");
      if (add) { e.stopPropagation(); const { rest } = route(); const bm = C.bookmarks[rest[0]] ? rest[0] : "867.1.1"; let cur = (rest[1] || "").split(",").filter(Boolean); const k = add.dataset.cmp; cur = cur.includes(k) ? cur.filter(x => x !== k) : [...cur, k].slice(-3); go("cultures/" + bm + (cur.length ? "/" + cur.join(",") : "")); return; }
      const fg = e.target.closest("[data-fg]"); if (fg) { innFilter.group = fg.dataset.fg; render(); return; }
      const fs = e.target.closest("[data-fs]"); if (fs) { innFilter.skill = fs.dataset.fs; render(); return; }
      const fl = e.target.closest("[data-fl]"); if (fl) { legFilter = fl.dataset.fl; render(); return; }
      const hit = e.target.closest("[data-go]"); if (hit && !e.target.closest("select, input")) { e.preventDefault(); go(hit.dataset.go); }
    });
    document.addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".node, .track li")) { e.preventDefault(); go(e.target.dataset.go); }
    });
    if (document.getElementById("buildLink").href.includes("__BUILD" + "_SHA__")) document.getElementById("buildLink").remove();
    if (!location.hash && !startHash()) history.replaceState(null, "", "#perks");
    render();
  </script>
  <script>
    // First-party pageview logging -- see counter's BeaconController/
    // PageView. No cookie, no persistent visitor id. Plain static page (no
    // client-side routing), so this fires once per load. The subdomain is
    // read from the hostname.
    (() => {
      const payload = JSON.stringify({
        app: "counter",
        subdomain: location.hostname.split(".")[0],
        path: location.pathname,
        referrer: document.referrer,
      });
      if (navigator.sendBeacon) {
        navigator.sendBeacon("https://jane.berlin/beacon", payload);
      } else {
        fetch("https://jane.berlin/beacon", { method: "POST", body: payload, keepalive: true });
      }

      // The follow-up: sent once, the first time something on the page moves or is
      // pressed. Most scripted visits never do (see BeaconController).
      const events = ["pointerdown", "pointermove", "keydown", "scroll", "touchstart", "wheel"];
      const body = JSON.stringify({ event: "engaged", app: "counter", subdomain: location.hostname.split(".")[0], path: location.pathname });
      const onEvent = () => {
        if (document.visibilityState !== "visible") return;
        events.forEach((name) => window.removeEventListener(name, onEvent, true));
        if (navigator.sendBeacon) {
          navigator.sendBeacon("https://jane.berlin/beacon", body);
        } else {
          fetch("https://jane.berlin/beacon", { method: "POST", body, keepalive: true });
        }
      };
      events.forEach((name) => window.addEventListener(name, onEvent, { capture: true, passive: true }));
    })();
  </script>
